services:

  # ==========================================
  # NGINX WEB SERVER
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: it302_nginx
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./main_system:/var/www/main
      - ./microservice:/var/www/microservice
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php
      - mysql
    networks:
      - web_network


  # ==========================================
  # PHP-FPM APPLICATION SERVER
  # ==========================================
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: it302_php
    volumes:
      - ./main_system:/var/www/main
      - ./microservice:/var/www/microservice
    depends_on:
      - mysql
      - redis
    networks:
      - web_network


  # ==========================================
  # MYSQL DATABASE
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: it302_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: hotel_pass
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - web_network


  # ==========================================
  # PHPMYADMIN
  # ==========================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: it302_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - web_network


  # ==========================================
  # WORKSPACE
  # ==========================================
  workspace:
    image: devilbox/php-fpm:8.2-work
    container_name: it302_workspace
    environment:
      - PHP_IDE_CONFIG=serverName=localhost
    volumes:
      - ./:/var/www/html
      - ./workspace:/home/workspace
    working_dir: /var/www/html
    stdin_open: true
    tty: true
    depends_on:
      - php
      - mysql
    networks:
      - web_network


  # ==========================================
  # REDIS
  # ==========================================
  redis:
    image: redis:alpine
    container_name: it302_redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - web_network


  # ==========================================
  # MAILHOG
  # ==========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: it302_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - web_network


# ==========================================
# DOCKER NETWORK
# ==========================================
networks:
  web_network:
    driver: bridge